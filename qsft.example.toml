# Copy to qsft.toml (not committed) and fill in. Command-line options override these.
# Find serial numbers with: uv run python -m qsft.probe identify (shake a tracker to see its serial)

[probe]
# Person B's body trackers (forwarded to the Quest).
trackers = ["LHR-00000000", "LHR-11111111", "LHR-22222222"]

# The tracker mounted on the Quest Pro for calibration.
calibration_tracker = "LHR-33333333"

# The Quest's IP address. Optional: when empty, it's found via mDNS.
# quest_ip = "192.168.1.50"

# This PC's LAN address to advertise. Optional: by default, the address on the route to the Quest.
# lan_ip = "192.168.1.10"

# UDP port to receive VRChat's OSC on. Optional: by default, any free port.
# osc_port = 9101

# Bridge: VRChat draws incoming trackers ~21 cm below the coordinates it reports poses in; the bridge
# lifts them so the real floor (SteamVR's) lands at VRChat's y = 0 (default true). See BRIDGE.md.
# align_floor = true
# Extra height adjustment for forwarded trackers, in metres (default 0).
# height_offset_m = 0.0
